<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video lồng tiếng – Lồng Tiếng Việt</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <style>
      body {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h1 {
        font-size: 20px;
      }
      video {
        width: 100%;
        max-height: 70vh;
        background: #000;
        border-radius: var(--radius);
      }
      .buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      #recent {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      #recent li {
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../icons/icon48.png" alt="" width="36" height="36" />
      <h1>Video lồng tiếng</h1>
    </header>

    <section class="card" id="current" hidden>
      <h2 id="title"></h2>
      <p id="info" class="hint"></p>
      <video id="player" controls preload="metadata"></video>
      <div class="buttons">
        <button id="download-video" class="primary">Tải video</button>
        <button id="download-srt" hidden>Tải phụ đề tiếng Việt (.srt)</button>
        <button id="delete">Xoá bản quay</button>
      </div>
      <p class="hint">
        File lưu trên máy này (tiện ích giữ 3 bản quay gần nhất). Phụ đề .srt
        khớp thời gian của file quay – dùng được trong CapCut, Premiere, VLC.
      </p>
    </section>

    <p id="message" class="hint"></p>

    <section class="card">
      <h2>Bản quay gần đây</h2>
      <ul id="recent"></ul>
      <p class="hint">
        Video của người khác chỉ dùng để học tập, giảng dạy nội bộ; muốn đăng
        lại cần được tác giả cho phép.
      </p>
    </section>

    <script src="../shared/record-math.js"></script>
    <script src="../shared/recordings-db.js"></script>
    <script src="result.js"></script>
  </body>
</html>
